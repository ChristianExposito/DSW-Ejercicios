<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listar</title>
</head>
<body>
<table>
    <thead>
    <tr><th>Nombre</th><th>Vida media</th></tr>
        <th>Extinto</th>
    </thead>
    <tbody>
<tr th:each = "animal :${animales}">
    <td th:text="${animal.nombre}"></td>
    <td th:text="${animal.vidaMedia}"></td>
    <td th:text="${animal.extinto}"></td>
</tr>
    </tbody>
</table>
</body>
</html>
